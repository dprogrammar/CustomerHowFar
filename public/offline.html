<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#008751" />
    <meta name="robots" content="noindex" />
    <title>You're offline | CustomerHowFar</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f7f8f7;
        color: #111827;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .logo {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 20px;
      }
      .logo span {
        color: #c46a00;
      }
      h1 {
        margin: 28px 0 8px;
        font-size: 24px;
        line-height: 1.25;
      }
      p {
        margin: 0 0 12px;
        font-size: 16px;
        line-height: 1.6;
        color: #374151;
      }
      ul {
        text-align: left;
        margin: 16px auto 24px;
        padding-left: 20px;
        color: #374151;
        line-height: 1.7;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 24px;
        border-radius: 8px;
        background: #008751;
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:focus-visible {
        outline: 3px solid #fba224;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-label="CustomerHowFar">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#008751" />
          <path
            d="M16 6.5c-3.9 0-7 3-7 6.9 0 5 7 12.1 7 12.1s7-7.1 7-12.1c0-3.9-3.1-6.9-7-6.9Z"
            fill="#fff"
          />
          <circle cx="16" cy="13.4" r="2.8" fill="#fba224" />
        </svg>
        <div>Customer<span>HowFar</span></div>
      </div>
      <h1>You're offline</h1>
      <p>
        We can't reach CustomerHowFar right now. Your phone seems to have no internet connection.
      </p>
      <ul>
        <li>Check that mobile data or Wi-Fi is on.</li>
        <li>Move to a spot with better signal.</li>
        <li>Then try again. Nothing you did has been lost.</li>
      </ul>
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
